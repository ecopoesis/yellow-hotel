name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + coverage gate
        run: ./gradlew check --console=plain
      - name: Accuracy suites (hardware test ROMs)
        run: ./gradlew :core:accuracyTest --console=plain
      - name: Performance gate (relaxed for shared runners)
        run: ./gradlew :core:perfTest -PperfMultiple=2 --console=plain
